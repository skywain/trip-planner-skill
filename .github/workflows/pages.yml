name: Deploy demo site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - 'docs/showcase/**'
      - 'scripts/build_site.py'
      - '.github/workflows/pages.yml'
      # the build renders china-clay / mexico-noir / japan-zine from source
      - 'themes/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the site
        run: python3 scripts/build_site.py --out _site

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
